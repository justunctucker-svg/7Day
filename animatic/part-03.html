<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo 07 Part 3</title>
<link rel="stylesheet" href="engine/animatic.css">
</head>
<body>
<main>
  <header>
    <h1>PROJECT ECHO 07 · PART 3 · "SUBJECT 06"</h1>
    <p>Animatic v1 · 60 s · 24 fps boards · <a href="index.html">Part 1</a> · <a href="part-02.html">Part 2</a> · <a href="part-04.html">Part 4</a> · <a href="part-05.html">Part 5</a></p>
  </header>

  <div class="stage" id="stage">
    <canvas id="screen" width="1280" height="720" aria-label="Animatic playback"></canvas>
    <div class="overlay" id="overlay"><span>▶ PLAY WITH SOUND</span></div>
  </div>

  <div class="controls">
    <button id="play" type="button">▶ Play</button>
    <span class="time" id="time">00:00:00 / 01:00</span>
    <div class="scrub">
      <div class="track" id="track"></div>
      <div class="head" id="head"></div>
      <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Scrub timeline">
    </div>
  </div>
  <div class="toggles">
    <button id="tSubs" type="button" aria-pressed="true">Subtitles</button>
    <button id="tBurn" type="button" aria-pressed="true">Timecode burn-in</button>
    <button id="tVO" type="button" aria-pressed="true">Voices</button>
    <button id="tMute" type="button" aria-pressed="false">Mute SFX</button>
    <button id="tMark" type="button" aria-pressed="false">Mark match P1 00:03 ↔ P3 00:55</button>
    <button id="tVert" type="button" aria-pressed="false">9:16 vertical</button>
  </div>

  <h2>Shot list</h2>
  <ol class="shots" id="shots"></ol>

  <p class="note">Rough boards for timing only. All SFX are synthesized placeholders; the voice is synthetic scratch VO.</p>
</main>

<script src="vo/part-03.js"></script>
<script src="engine/core.js"></script>
<script src="engine/props.js"></script>
<script src="part-03/shots.js"></script>
<script src="engine/player.js"></script>
</body>
</html>
